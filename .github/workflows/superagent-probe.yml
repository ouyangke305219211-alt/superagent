name: superagent probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/superagent-probe.yml'
permissions:
  issues: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Open a probe issue as the Actions bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Probe: 新增 hello.md 文档 v4" \
            --body "@ouyangke305219211-alt 请在这个仓库新增一个 hello.md 文件，内容写 \"hello superagent\"，改完开一个 PR 给我。"
